# Alembic configuration. The database URL is not set here: migrations/env.py takes the
# engine from budgeter.core.database, which reads DATABASE_URL from the environment.

[alembic]
script_location = %(here)s/migrations

# Files are named <rev>_<slug>.py. Create revisions with a four-digit sequence number:
#   uv run alembic revision -m "add users" --rev-id 0002
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

[post_write_hooks]
# Format generated revisions so migrations/ passes `make lint`.
hooks = ruff_fix, ruff_format

ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
